services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: autoservice
      POSTGRES_USER: autoservice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoservice -d autoservice"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?required}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?required}
    volumes:
      - ./deploy/minio-autoservice-app-policy.json:/etc/minio/autoservice-app-policy.json:ro
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do sleep 1; done;
      mc mb --ignore-existing local/autoservice-media;
      mc anonymous set none local/autoservice-media;
      mc admin user add local \"$$MINIO_APP_ACCESS_KEY\" \"$$MINIO_APP_SECRET_KEY\";
      mc admin policy create local autoservice-app /etc/minio/autoservice-app-policy.json;
      mc admin policy attach local autoservice-app --user \"$$MINIO_APP_ACCESS_KEY\""

  migrate:
    build:
      context: ./server
      target: build
    command: npm run db:migrate:deploy
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://autoservice:${POSTGRES_PASSWORD}@postgres:5432/autoservice?schema=public

  seed:
    build:
      context: ./server
      target: build
    command: npm run db:seed
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://autoservice:${POSTGRES_PASSWORD}@postgres:5432/autoservice?schema=public
      BOOTSTRAP_ADMIN_LOGIN: ${BOOTSTRAP_ADMIN_LOGIN:-}
      BOOTSTRAP_ADMIN_PASSWORD_HASH: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Администратор}
      BOOTSTRAP_USERS_JSON: ${BOOTSTRAP_USERS_JSON:-[]}

  api:
    build:
      context: ./server
      target: runtime
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?required}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?required}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:?required}
      SMS_PROVIDER: ${SMS_PROVIDER:-disabled}
      SMS_RU_API_ID: ${SMS_RU_API_ID:-}
      SMS_RU_FROM: ${SMS_RU_FROM:-}
      SMS_RU_VERIFICATION_MODE: ${SMS_RU_VERIFICATION_MODE:-callcheck}
      HOST: 0.0.0.0
      PORT: 8080
      LOG_LEVEL: info
      DATABASE_URL: postgresql://autoservice:${POSTGRES_PASSWORD}@postgres:5432/autoservice?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?required}
      S3_REGION: ru-central1
      S3_BUCKET: autoservice-media
      S3_ACCESS_KEY_ID: ${MINIO_APP_ACCESS_KEY:?required}
      S3_SECRET_ACCESS_KEY: ${MINIO_APP_SECRET_KEY:?required}
      S3_FORCE_PATH_STYLE: "true"
      WORKER_POLL_INTERVAL_MS: 1000
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./server
      target: runtime
    restart: unless-stopped
    command: node dist/worker.js
    depends_on:
      seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?required}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?required}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:?required}
      SMS_PROVIDER: ${SMS_PROVIDER:-disabled}
      SMS_RU_API_ID: ${SMS_RU_API_ID:-}
      SMS_RU_FROM: ${SMS_RU_FROM:-}
      SMS_RU_VERIFICATION_MODE: ${SMS_RU_VERIFICATION_MODE:-callcheck}
      DATABASE_URL: postgresql://autoservice:${POSTGRES_PASSWORD}@postgres:5432/autoservice?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?required}
      S3_REGION: ru-central1
      S3_BUCKET: autoservice-media
      S3_ACCESS_KEY_ID: ${MINIO_APP_ACCESS_KEY:?required}
      S3_SECRET_ACCESS_KEY: ${MINIO_APP_SECRET_KEY:?required}
      S3_FORCE_PATH_STYLE: "true"
      WORKER_POLL_INTERVAL_MS: 1000

volumes:
  postgres-data:
  minio-data:
