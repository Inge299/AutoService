name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: autoservice
          POSTGRES_USER: autoservice
          POSTGRES_PASSWORD: autoservice-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoservice -d autoservice"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://autoservice:autoservice-ci@127.0.0.1:5432/autoservice?schema=public
      TEST_DATABASE_URL: postgresql://autoservice:autoservice-ci@127.0.0.1:5432/autoservice_test?schema=public
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - name: Prepare isolated transaction-test database
        run: |
          # psql does not accept Prisma's schema query parameter.
          psql "${DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE autoservice_test'
          DATABASE_URL="$TEST_DATABASE_URL" npm run db:migrate:deploy
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      AUTOSERVICE_VERSION_CODE: ${{ github.run_number }}
      ANDROID_SIGNING_AVAILABLE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure stable Android signing
        if: env.ANDROID_SIGNING_AVAILABLE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/autoservice-release.jks"
          echo "AUTOSERVICE_KEYSTORE_FILE=$RUNNER_TEMP/autoservice-release.jks" >> "$GITHUB_ENV"
          echo "AUTOSERVICE_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AUTOSERVICE_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AUTOSERVICE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon --no-configuration-cache
      - name: Build signed release APK
        if: env.ANDROID_SIGNING_AVAILABLE == 'true'
        run: ./gradlew assembleRelease --no-daemon --no-configuration-cache
      - uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Verify release APK signature and build flags
        if: env.ANDROID_SIGNING_AVAILABLE == 'true'
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/release-signature.txt"
          grep -Fq "Signer #1 certificate SHA-256 digest: 2d3fba77411b2b68d0cae37ca4582c8720de142923a8381353e0a7cd11949c93" "$RUNNER_TEMP/release-signature.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" > "$RUNNER_TEMP/release-badging.txt"
          if grep -q "application-debuggable" "$RUNNER_TEMP/release-badging.txt"; then
            echo "Release APK must not be debuggable" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        if: env.ANDROID_SIGNING_AVAILABLE == 'true'
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Build one-time legacy signer transition and test helper
        if: env.ANDROID_SIGNING_AVAILABLE == 'true'
        run: |
          echo "fc8a8dcee5680e7eb1658e59f3c672a1171d012cb08391d7f20dffc8c6eb751d  android/signing/legacy-debug-to-release.lineage" | sha256sum -c -
          ./gradlew :android:app:assembleDebugAndroidTest --no-daemon --no-configuration-cache
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/app-release-test-helper.apk"
          ./gradlew :android:app:assembleRelease -PAUTOSERVICE_TRANSITION_RELEASE=true --no-daemon --no-configuration-cache
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$AUTOSERVICE_KEYSTORE_FILE" --ks-key-alias "$AUTOSERVICE_KEY_ALIAS" \
            --ks-pass env:AUTOSERVICE_KEYSTORE_PASSWORD --key-pass env:AUTOSERVICE_KEY_PASSWORD \
            --lineage android/signing/legacy-debug-to-release.lineage \
            --min-sdk-version 28 --rotation-min-sdk-version 28 \
            --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true --v4-signing-enabled false \
            --debuggable-apk-permitted false --out "$RUNNER_TEMP/app-release-transition.apk" \
            android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --min-sdk-version 28 --print-certs "$RUNNER_TEMP/app-release-transition.apk" | tee "$RUNNER_TEMP/transition-signature.txt"
          grep -Fq "Signer #1 certificate SHA-256 digest: 2d3fba77411b2b68d0cae37ca4582c8720de142923a8381353e0a7cd11949c93" "$RUNNER_TEMP/transition-signature.txt"
          grep -Fq "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/transition-signature.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$RUNNER_TEMP/app-release-transition.apk" > "$RUNNER_TEMP/transition-badging.txt"
          grep -Eq "^(sdkVersion|minSdkVersion):'28'" "$RUNNER_TEMP/transition-badging.txt"
          if grep -q "application-debuggable" "$RUNNER_TEMP/transition-badging.txt"; then exit 1; fi
      - uses: actions/upload-artifact@v6
        if: env.ANDROID_SIGNING_AVAILABLE == 'true'
        with:
          name: app-release-transition
          path: ${{ runner.temp }}/app-release-transition.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: env.ANDROID_SIGNING_AVAILABLE == 'true'
        with:
          name: app-release-test-helper
          path: ${{ runner.temp }}/app-release-test-helper.apk
          if-no-files-found: error
